server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Same-origin reverse proxy to the backend: the browser never talks cross-origin,
    # so no CORS handling is needed for this containerized deployment.
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Angular client-side routing: serve index.html for any path that isn't a real file.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
