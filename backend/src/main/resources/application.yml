spring:
  application:
    name: messaging-cacib

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/messaging}
    username: ${DB_USERNAME:messaging}
    password: ${DB_PASSWORD:messaging}
    hikari:
      pool-name: messaging-hikari
      # Sized against APP_MQ_CONCURRENCY (max 10 JMS listener threads, each holding one
      # connection during its transactional insert): 20 leaves ~10 connections of headroom
      # for concurrent REST reads during ingestion peaks.
      maximum-pool-size: ${DB_POOL_MAX:20}
      minimum-idle: ${DB_POOL_MIN:5}
      connection-timeout: ${DB_POOL_CONNECTION_TIMEOUT_MS:10000}
      leak-detection-threshold: ${DB_POOL_LEAK_DETECTION_MS:30000}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    baseline-on-migrate: true

  jms:
    listener:
      session:
        transacted: true

ibm:
  mq:
    conn-name: ${MQ_CONN_NAME:localhost(1414)}
    channel: ${MQ_CHANNEL:DEV.APP.SVRCONN}
    queue-manager: ${MQ_QMGR_NAME:QM1}
    user: ${MQ_APP_USER:app}
    password: ${MQ_APP_PASSWORD:passw0rd}
    userAuthenticationMQCSP: true
    pool:
      enabled: true
      max-connections: ${MQ_POOL_MAX_CONNECTIONS:10}
      max-sessions-per-connection: ${MQ_POOL_MAX_SESSIONS:10}

app:
  mq:
    queue: ${APP_MQ_QUEUE:DEV.QUEUE.1}
    backout-queue: ${APP_MQ_BACKOUT_QUEUE:DEV.QUEUE.BACKOUT}
    backout-threshold: ${APP_MQ_BACKOUT_THRESHOLD:3}
    concurrency: ${APP_MQ_CONCURRENCY:5-10}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:4200}

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      # "when-authorized" would show nothing at all here: this exercise has no
      # authentication (CLAUDE.md §1), so no caller is ever "authorized" and the DB/JMS
      # component details would stay hidden forever. "always" is the pragmatic choice
      # given that constraint — in a real deployment this would instead sit behind a
      # separate internal management port (management.server.port), not "always" on
      # the public one.
      show-details: always

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

logging:
  pattern:
    correlation: "[%X{correlationId:-}]"
  level:
    root: INFO
    com.cacib.messaging: DEBUG
