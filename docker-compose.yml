services:
  postgres:
    image: postgres:16-alpine
    container_name: messaging-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-messaging}
      POSTGRES_USER: ${POSTGRES_USER:-messaging}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-messaging}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-messaging} -d ${POSTGRES_DB:-messaging}"]
      interval: 5s
      timeout: 5s
      retries: 10

  ibmmq:
    build:
      context: ./mq-config
    image: messaging-ibmmq-dev:9.4.0.0-r3
    container_name: messaging-ibmmq
    restart: unless-stopped
    environment:
      LICENSE: accept
      MQ_QMGR_NAME: ${MQ_QMGR_NAME:-QM1}
      MQ_APP_PASSWORD: ${MQ_APP_PASSWORD:-passw0rd}
      MQ_ADMIN_PASSWORD: ${MQ_ADMIN_PASSWORD:-passw0rd}
    ports:
      - "1414:1414"
      - "9443:9443"
    volumes:
      - ibmmq-data:/mnt/mqm
    healthcheck:
      test: ["CMD", "chkmqhealthy"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 60s

volumes:
  postgres-data:
  ibmmq-data:
